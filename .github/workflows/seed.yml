name: Seed

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Validate context and tooling
        run: make check test build
      - name: Require Go formatting
        run: test -z "$(gofmt -l cmd)"
      - name: Lint workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/seed.yml
      - name: Render reviewable issue proposals
        run: make issue-drafts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-proposals-${{ github.sha }}
          path: .local/issues/*.md
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
