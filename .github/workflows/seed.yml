name: Seed

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Separate caller workflows may qualify the same commit without canceling each other.
  group: seed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Full cold-cache SQL/container proofs exceeded 20m in Production build41263883683.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Validate context and tooling
        run: make check test build
      - name: Prove offline webhook release and rollout guards
        run: make release-test
      - name: Require Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Preserve existing migration SQL
        if: github.event_name == 'pull_request'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/migrate.sh check "$BASE_COMMIT"
      # This isolated runner includes source-backed restore/load; report its failures before unrelated SQL suites.
      - name: Enrollment through acquisition, source restore and posting volume proof
        run: make provider-flow-test
      - name: Prove isolated PostgreSQL migrations
        run: make migration-test
      - name: Prove restricted cloud migration roles on disposable PostgreSQL
        run: make cloud-sql-test worker-bootstrap-test webhook-bootstrap-test production-webhook-bootstrap-test verifier-bootstrap-test
      - name: Prove transactional ledger on disposable PostgreSQL
        run: make ledger-test
      - name: Prove receipt-only observer on disposable PostgreSQL
        run: make observer-test
      - name: Synthetic source registry and durable import SQL proof
        run: make source-registry-test
      - name: Synthetic staging through durable import service proof
        run: make import-service-test
      - name: Private source authority, replay and restricted HTTP proof
        run: make private-registry-test
      - name: Private taxonomy, labels and restricted HTTP proof
        run: make collection-labels-test
      - name: Strategic tags and payload-free private recovery proof
        run: make tags-recovery-test
      - name: Rich private query and authorized source detail proof
        run: make collection-query-test
      - name: Finite owner-only Sandbox activation operator proof
        run: make private-activation-test
      - name: Private rule service and atomic reviewed application proof
        run: make collection-rules-test
      - name: Recoverable self-service private onboarding and adoption proof
        run: make collection-onboarding-test
      - name: Fenced synthetic provider publication proof
        run: make sync-state-test
      - name: Scoped synthetic connection lifecycle proof
        run: make connection-state-test
      - name: Connection operations and signed webhook proof
        run: make connection-ops-test webhook-test
      - name: Synthetic enrollment service composition proof
        run: make connection-service-test
      - name: Synthetic provider acquisition composition proof
        run: make acquisition-test
      - name: Durable acquisition dispatch and retry proof
        run: make sync-dispatch-test
      - name: Independent exact source review and zero journal proof
        run: make sandbox-verification-test
      - name: Build and prove isolated health-only API container
        run: bash scripts/test-api-container.sh
      - name: Build and verify inert non-root migration image
        run: bash scripts/test-migrator-container.sh
      - name: Prove isolated fail-closed worker container
        run: bash scripts/test-worker-container.sh
      - name: Prove Sandbox diagnostic defaults to offline
        run: bash scripts/test-sandbox-qualification.sh
      - name: Lint workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Render reviewable issue proposals
        run: make issue-drafts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-proposals-${{ github.sha }}
          path: .local/issues/*.md
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked browser dependencies
        run: npm --prefix web ci
      - name: Check generated API and browser types
        run: make web-check
      - name: Test synthetic sign-in and bookkeeping behavior
        run: make web-test
      - name: Build the unconfigured application
        run: make web-build
      - name: Build isolated fictional frontend review
        id: frontend-review
        run: npm --prefix web run review:build
      - name: Install Chromium for synthetic browser proof
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise synthetic browser journeys
        run: make web-browser
      - name: Retain fictional frontend review and responsive screenshots
        if: ${{ always() && steps.frontend-review.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-review-${{ github.sha }}
          path: |
            .local/frontend-review/jayburd-frontend-review.html
            web/test-results/**/frontend*.png
            web/test-results/**/connected-accounts-*.png
            web/test-results/**/saved-work-*.png
            web/test-results/**/idle-customer-workspace.png
            web/test-results/**/rule-workspace-*.png
          retention-days: 7
          if-no-files-found: error
          # Only the exact fictional HTML above is selected from the hidden build directory.
          include-hidden-files: true
      - name: Prove isolated identity rehearsal with intercepted synthetic responses
        run: make identity-rehearsal-test
      - name: Test image receipt integrity
        run: node --test scripts/image-receipt.test.mjs
      - name: Prove standalone frontend image
        run: bash scripts/test-web-container.sh
      - name: Check browser dependency vulnerabilities
        run: npm --prefix web audit --audit-level=high
  application-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prove isolated first-book operator bootstrap
        run: make sandbox-bootstrap-test production-book-bootstrap-test
      - name: Install locked browser dependencies
        run: npm --prefix web ci
      - name: Install Chromium for real application proof
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: Automatic source-backed accounting and recovery through restricted SQL
        run: make automatic-accounting-test
      - name: Durable automatic categories and whole-result exceptions proof
        run: make automatic-categorization-test
      - name: Automatic category application journey through Next and restricted SQL
        run: make automatic-categorization-browser
      - name: Prove private topics and labels through browser and restricted SQL
        run: make labels-integration
      - name: Prove in-app private workspace setup and existing connection adoption
        run: make onboarding-integration
      - name: Prove browser recovery through real API and PostgreSQL
        run: make app-integration
      - name: Prove synthetic connection through source posting
        run: make connection-browser-test
      - name: Prove fictional Production profile through browser and restricted SQL
        run: make production-journey-test
      - name: Prove generated demo balances and cent display
        run: make demo-test
