name: Build images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.actor_id == '55423093' && github.repository_id == '1414515318' && github.triggering_actor == 'justin-napolitano'
    uses: ./.github/workflows/seed.yml
  images:
    if: github.ref == 'refs/heads/main' && github.actor_id == '55423093' && github.triggering_actor == 'justin-napolitano'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, migrate, web, worker]
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public project metadata
        shell: bash
        run: |
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$PROJECT_NUMBER" =~ ^[0-9]{6,20}$ ]]
          mkdir -p "$RUNNER_TEMP/jayburd-docker" receipts
          echo "DOCKER_CONFIG=$RUNNER_TEMP/jayburd-docker" >> "$GITHUB_ENV"
          echo "IMAGE=us-central1-docker.pkg.dev/$PROJECT_ID/jayburd-dev/$COMPONENT:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build once before cloud authentication
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: |
          docker buildx build --platform linux/amd64 --load --metadata-file receipts/build.json \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file "Dockerfile.$COMPONENT" --tag "$IMAGE" .
          echo "IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE")" >> "$GITHUB_ENV"
      - name: Prove exact candidate runtime
        run: |
          case "$COMPONENT" in
            api) bash scripts/test-api-container.sh --image "$IMAGE_ID" ;;
            migrate) bash scripts/test-migrator-container.sh --image "$IMAGE_ID" ;;
            web) bash scripts/test-web-container.sh --image "$IMAGE_ID" ;;
            worker) bash scripts/test-worker-container.sh --image "$IMAGE_ID" ;;
            *) exit 1 ;;
          esac
      - name: Block high and critical image vulnerabilities
        id: image_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.IMAGE_ID }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: receipts/vulnerabilities.json
          cache: false
      - name: Retain failed vulnerability report for diagnosis
        if: failure() && steps.image_scan.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejected-scan-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/vulnerabilities.json
          retention-days: 7
          if-no-files-found: warn
      - name: Record dependency inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.IMAGE_ID }}
          scan-type: image
          format: cyclonedx
          output: receipts/sbom.cdx.json
          cache: false
      - name: Authenticate only the repository-scoped builder
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/jayburd-dev-github/providers/owner-build
          service_account: jayburd-dev-builder@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Publish the tested image without rebuilding
        run: |
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$IMAGE_ID"
          docker push "$IMAGE"
          docker image inspect --format '{{json .RepoDigests}}' "$IMAGE" > receipts/repo-digests.json
          node scripts/image-receipt.mjs
      - name: Retain successful candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/*.json
          retention-days: 30
          if-no-files-found: error
