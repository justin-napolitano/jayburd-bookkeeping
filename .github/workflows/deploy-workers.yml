name: Deploy paused development workers
on:
  workflow_dispatch:
    inputs:
      release_sha256:
        description: SHA256 of reviewed deploy/worker-release.json on main
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: dev-runtime-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.actor_id == '55423093' && github.repository_id == '1414515318' && github.triggering_actor == 'justin-napolitano'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      RELEASE_SHA256: ${{ inputs.release_sha256 }}
      TF_IN_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
      - name: Validate owner-approved worker release and closure gates before authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/worker-release-manifest.mjs deploy/worker-release.json "$RELEASE_SHA256" "$RUNNER_TEMP/release"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import {workerGates} from './scripts/worker-release-manifest.mjs';
          const m=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/release/approved.json'));
          if(m.project!==process.env.PROJECT_ID || m.projectNumber!==process.env.PROJECT_NUMBER) throw new Error('Project mismatch');
          appendFileSync(process.env.GITHUB_ENV,`BUILD_RUN=${m.build.run}\nBUILD_ATTEMPT=${m.build.attempt}\nBUILD_COMMIT=${m.build.commit}\nPREVIOUS_DEPLOYMENT=${m.previousDeployment??''}\n`);
          writeFileSync(process.env.RUNNER_TEMP+'/release/prs.txt',workerGates.prs.join('\n')+'\n');
          writeFileSync(process.env.RUNNER_TEMP+'/release/issues.txt',workerGates.issues.join('\n')+'\n');
          JS
          build_commit=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).build.commit' "$RUNNER_TEMP/release/approved.json")
          git merge-base --is-ancestor "$build_commit" "$GITHUB_SHA"
          while read -r pr; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .merged)" = true
            merged_commit=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .merge_commit_sha)
            git merge-base --is-ancestor "$merged_commit" "$GITHUB_SHA"
            git merge-base --is-ancestor "$merged_commit" "$build_commit"
          done < "$RUNNER_TEMP/release/prs.txt"
          while read -r issue; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq .state)" = closed
          done < "$RUNNER_TEMP/release/issues.txt"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Verify exact worker candidate and rollback evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/attempts/$BUILD_ATTEMPT" > "$RUNNER_TEMP/evidence/build-run.json"
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "image-worker-$BUILD_COMMIT-$BUILD_RUN-$BUILD_ATTEMPT" --dir "$RUNNER_TEMP/evidence/worker"
          if [[ -n "$PREVIOUS_DEPLOYMENT" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_DEPLOYMENT" > "$RUNNER_TEMP/evidence/previous-run.json"
            gh run download "$PREVIOUS_DEPLOYMENT" --repo "$GITHUB_REPOSITORY" \
              --name "worker-deployment-$PREVIOUS_DEPLOYMENT" --dir "$RUNNER_TEMP/evidence/previous"
          fi
          node scripts/worker-release-manifest.mjs deploy/worker-release.json "$RELEASE_SHA256" "$RUNNER_TEMP/release" "$RUNNER_TEMP/evidence"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.7'
          terraform_wrapper: false
      - name: Run credential-free release and infrastructure tests
        run: |
          make release-test
          make infra-test
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 500.0.0'
      - name: Recheck approval expiry immediately before authentication
        run: node scripts/worker-release-manifest.mjs deploy/worker-release.json "$RELEASE_SHA256" "$RUNNER_TEMP/release" "$RUNNER_TEMP/evidence"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/jayburd-dev-worker-deploy/providers/owner-worker-deploy
          service_account: jayburd-dev-worker-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Apply isolated worker runtime and read selected metadata
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: bash scripts/deploy-workers.sh "$RUNNER_TEMP/release"
      - name: Validate reconciled images and paused Scheduler
        run: |
          mkdir -p "$RUNNER_TEMP/receipt"
          node scripts/worker-deployment-receipt.mjs "$RUNNER_TEMP/release/approved.json" "$RUNNER_TEMP/release" "$RUNNER_TEMP/receipt/worker-deployment.json"
      - name: Retain only public worker deployment evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt/worker-deployment.json
          retention-days: 90
          if-no-files-found: error
